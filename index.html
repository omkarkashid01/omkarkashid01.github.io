<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #333;
        }
        .profile {
            max-width: 700px;
            margin: 60px auto;
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .profile img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #333;
            margin-bottom: 20px;
        }
        h1 { font-size: 32px; margin-bottom: 10px; }
        .role { color: #666; font-size: 18px; margin-bottom: 20px; }
        .bio { line-height: 1.6; margin-bottom: 25px; }
        .links a {
            display: inline-block;
            text-decoration: none;
            color: white;
            background: #333;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 8px;
        }
        .links a:hover { background: #555; }
        footer { margin-top: 30px; color: #777; font-size: 14px; }
    </style>
</head>
<body>
    <div class="profile">
        <img src="profile.jpg" alt="Profile Photo">
        <h1>Your Name</h1>
        <p class="role">Student | Developer | Researcher</p>
        <p class="bio">
            Hello! I am a student interested in technology,
            programming and research. Welcome to my personal profile page.
        </p>
        <div class="links">
            <a href="https://github.com/" target="_blank">GitHub</a>
            <a href="https://www.linkedin.com/" target="_blank">LinkedIn</a>
            <a href="mailto:your@email.com">Email</a>
        </div>
        <footer>© 2026 Your Name</footer>
    </div>
</body>
</html>
